name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise for this release'
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write

# One release at a time: two dispatches at once would both try to move master.
concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.11

jobs:
  check:
    name: Verify version and run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      sign: ${{ steps.sign.outputs.sign }}
    steps:
      # A dispatched release always comes off master, whatever ref the run was started from, and
      # needs the tags to work out which version comes next.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Work out the version being released
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            bun run scripts/version.ts --bump "$BUMP" --write --github
          else
            pkg=$(bun -e 'console.log(require("./package.json").version)')
            tag="${GITHUB_REF_NAME#v}"
            if [ "$pkg" != "$tag" ]; then
              echo "package.json version ($pkg) does not match tag ($tag)"; exit 1
            fi
            {
              echo "version=$pkg"
              echo "tag=$GITHUB_REF_NAME"
              echo "first=false"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Are Apple signing secrets configured?
        id: sign
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
        run: echo "sign=$HAS_CERT" >> "$GITHUB_OUTPUT"
      - run: bun run gen:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      # Everything passed, so record the release: the version bump lands on master and the tag
      # points at that commit. A tag push releases the commit it already points at. Pushes made
      # with GITHUB_TOKEN do not start another workflow run, so this tag does not re-trigger the
      # release; the rest of this run publishes it.
      - name: Commit the version and tag it
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — release it by pushing the tag, or pick another bump"; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "Release $TAG"
            git push origin "HEAD:master"
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
      - name: The commit being released
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "Releasing $TAG from $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build binaries
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - name: Checksums
        run: |
          cd dist
          rm -f *.map
          sha256sum indesign-mcp-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  sign-macos:
    # Signs and notarizes the macOS binaries when Apple credentials are configured as secrets.
    # Without them this job is skipped and the unsigned (ad-hoc signed by Bun) binaries are released.
    name: Sign and notarize macOS binaries
    needs: [check, build]
    if: ${{ needs.check.outputs.sign == 'true' }}
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Import certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
      - name: Sign, notarize, staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          cat > entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-executable-page-protection</key><true/>
          </dict></plist>
          EOF
          identity=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n1 | sed -E 's/.*"(.*)"/\1/')
          for bin in dist/indesign-mcp-*-macos-*; do
            codesign --force --options runtime --timestamp --entitlements entitlements.plist --sign "$identity" "$bin"
            ditto -c -k "$bin" "$bin.zip"
            xcrun notarytool submit "$bin.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
            rm "$bin.zip"
          done
          cd dist && sha256sum indesign-mcp-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          overwrite: true

  bundles:
    name: Claude Desktop bundles (.mcpb)
    needs: [check, build, sign-macos]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Build bundles
        run: bun run scripts/build-mcpb.ts --dist dist --out dist/bundles
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist/bundles/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check, build, sign-macos, bundles]
    if: ${{ always() && needs.build.result == 'success' && needs.bundles.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: dist/bundles
      - name: Release notes header
        run: |
          cat > notes.md <<'EOF'
          ## Install

          **Claude Desktop (one click):** download the `.mcpb` file for your computer below (macOS Apple Silicon = `macos-arm64`, Intel Mac = `macos-x64`, Windows = `windows-x64`) and open it; Claude Desktop installs it and asks for your OpenAI API key.

          **Claude Code / other clients:** download the plain executable for your platform, then run `indesign-mcp setup` and follow the instructions.

          Checksums are in `SHA256SUMS`.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            dist/indesign-mcp-*
            dist/SHA256SUMS
            dist/bundles/*.mcpb
