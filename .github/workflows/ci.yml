name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  build:
    name: Build binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pattern: indesign-mcp-*-linux-x64
          - os: macos-14
            pattern: indesign-mcp-*-macos-arm64
          - os: windows-latest
            pattern: indesign-mcp-*-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Run smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin=$(ls dist/${{ matrix.pattern }} | head -n1)
          chmod +x "$bin"
          "$bin" --version
          bun run test/smoke.ts "$bin"
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign -dv dist/indesign-mcp-*-macos-arm64
